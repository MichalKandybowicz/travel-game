services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: sh -c "npm install && npm run dev -w @travel-game/server"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: sh -c "npm install && npm run dev -w @travel-game/web -- --host 0.0.0.0"
    environment:
      VITE_SERVER_URL: http://localhost:3000
    depends_on:
      - server
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
